<!DOCTYPE html>
<html>
<head>

    <title>Add Blog - MyBlogSpace</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            MyBlogSpace
        </a>

        <a href="{% url 'home' %}"
           class="btn btn-light">
            Back to Home
        </a>

    </div>

</nav>


<!-- Add Blog Form -->

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow mt-5">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Add New Blog
                    </h2>

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}


                        <!-- Title -->

                        <div class="mb-3">

                            <label class="form-label">
                                Blog Title
                            </label>

                            <input type="text"
                                   name="title"
                                   class="form-control"
                                   placeholder="Enter blog title"
                                   required>

                        </div>


                        <!-- Content -->

                        <div class="mb-3">

                            <label class="form-label">
                                Blog Content
                            </label>

                            <textarea name="content"
                                      class="form-control"
                                      rows="6"
                                      placeholder="Write your blog here..."
                                      required></textarea>

                        </div>


                        <!-- Image -->

                        <div class="mb-4">

                            <label class="form-label">
                                Blog Image
                            </label>

                            <input type="file"
                                   name="image"
                                   class="form-control"
                                   accept="image/*"
                                   required>

                        </div>


                        <!-- Button -->

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Add Blog

                        </button>

                    </form>


                    <div class="text-center mt-3">

                        <a href="{% url 'home' %}"
                           class="text-decoration-none">

                            ← Back to Home

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
